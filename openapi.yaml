openapi: 3.0.3
info:
  title: TaskPulse API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      tags: [Health]
      summary: Проверить состояние приложения
      responses:
        '200':
          description: Приложение и PostgreSQL доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Одна из зависимостей недоступна
  /users:
    get:
      tags: [Users]
      summary: Получить список пользователей
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Users]
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Получить пользователя
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Обновить пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Удалить пользователя
      responses:
        '204':
          description: Пользователь удалён
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Данные не прошли проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, services]
      properties:
        status:
          type: string
          enum: [ok, error]
        services:
          type: object
          required: [app, postgres]
          properties:
            app:
              type: string
              enum: [ok]
            postgres:
              type: string
              enum: [ok, error]
    User:
      type: object
      required: [id, full_name, phone, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
        created_at:
          type: string
          example: '2026-08-28 12:00:00'
        updated_at:
          type: string
          example: '2026-08-28 12:00:00'
    CreateUser:
      type: object
      required: [full_name]
      properties:
        full_name:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
    UpdateUser:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
    UserList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
    Error:
      type: object
      required: [name, message, code, status]
      properties:
        name:
          type: string
        message:
          type: string
        code:
          type: integer
        status:
          type: integer
